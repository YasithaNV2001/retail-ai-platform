name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: databricks/setup-cli@main
      - name: P-10 Databricks from Actions
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks current-user me | jq -r .userName
      - name: P-11 publish to a rap-data release
        env:
          GH_TOKEN: ${{ secrets.RAP_DATA_WRITE_TOKEN }}
        run: |
          echo "probe $(date -u)" > probe.txt
          gh release create probe --repo YasithaNV2001/rap-data --title probe --notes probe || true
          gh release upload probe probe.txt --repo YasithaNV2001/rap-data --clobber
      - name: P-14 Neon from Actions
        env:
          URL: ${{ secrets.RAP_NEON_FEATURES_URL }}
        run: |
          which psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$URL" -c "select 1;"
